name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, hse-platform]
  pull_request:
    branches: [main, hse-platform]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beaconhs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://beaconhs_app:beaconhs_app@localhost:5432/beaconhs_test
      MIGRATION_DATABASE_URL: postgresql://beaconhs_migrator:beaconhs_migrator@localhost:5432/beaconhs_test
      SUPERADMIN_DATABASE_URL: postgresql://beaconhs_super:beaconhs_super@localhost:5432/beaconhs_test
      DATABASE_OWNER_ROLE: beaconhs_owner
      DATABASE_BACKUP_ROLE: beaconhs_backup
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-not-used-in-production-32chars
      ATTACHMENT_CAPABILITY_SECRET: ci-attachment-capability-secret-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      # No version here — package.json's packageManager field pins pnpm; passing
      # both errors "Multiple versions of pnpm specified". Node 24 matches the
      # deploy image and package engines.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision isolated owner, migration, and RLS roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE beaconhs_owner NOLOGIN NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE beaconhs_migrator LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'beaconhs_migrator';
          CREATE ROLE beaconhs_app LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'beaconhs_app';
          CREATE ROLE beaconhs_super LOGIN NOINHERIT NOSUPERUSER BYPASSRLS PASSWORD 'beaconhs_super';
          CREATE ROLE beaconhs_backup LOGIN NOINHERIT NOSUPERUSER BYPASSRLS PASSWORD 'beaconhs_backup';
          ALTER ROLE beaconhs_backup SET default_transaction_read_only = 'on';
          GRANT beaconhs_owner TO beaconhs_migrator;
          ALTER DATABASE beaconhs_test OWNER TO beaconhs_owner;
          REVOKE ALL ON DATABASE beaconhs_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE beaconhs_test TO beaconhs_migrator, beaconhs_app, beaconhs_super, beaconhs_backup;
          \connect beaconhs_test
          ALTER SCHEMA public OWNER TO beaconhs_owner;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          SQL
      # The live @beaconhs/db suites are mutually destructive: the seed
      # bootstrap truncates every tenant row and finishes with no tenant, while
      # phase11e asserts on the seeded demo rows. They therefore get one
      # database each, plus a third runtime database for the RLS/freeze suites.
      # The names deliberately contain the `ci` segment that the suites' scratch
      # identity guard requires; pointing a suite at `beaconhs` fails closed.
      - name: Provision isolated scratch databases for live DB suites
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for db in beaconhs_ci_owner beaconhs_ci_seeded beaconhs_ci_runtime; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE ${db} OWNER beaconhs_owner;"
            psql -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 <<SQL
          REVOKE ALL ON DATABASE ${db} FROM PUBLIC;
          GRANT CONNECT ON DATABASE ${db} TO beaconhs_migrator, beaconhs_app, beaconhs_super, beaconhs_backup;
          GRANT CONNECT, CREATE, TEMPORARY ON DATABASE ${db} TO beaconhs_migrator;
          ALTER SCHEMA public OWNER TO beaconhs_owner;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          GRANT USAGE, CREATE ON SCHEMA public TO beaconhs_owner;
          GRANT USAGE ON SCHEMA public TO beaconhs_app, beaconhs_super, beaconhs_backup;
          SQL
          done
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm deadcode:check
      - name: Guard migration metadata integrity
        run: pnpm --filter @beaconhs/db check:migration-drift
      - name: Test deployment host safeguards
        run: |
          scripts/cluster/dokploy-curl.test.sh
          scripts/ci/require-current-main.test.sh
          scripts/ci/workflow-repository-immutability.test.sh
          scripts/ci/verify-server-action-key-gate.test.sh
          node --test scripts/ci/replica-coverage.test.mjs
          scripts/ci/build-local-image-key-gate.test.sh
          node --test scripts/ci/verify-source-origin.test.mjs
          node --test scripts/ci/build-identity-gate.test.mjs
          node --test scripts/ci/deploy-control-hardening.test.mjs
      - name: Apply the production migration path
        run: pnpm --filter @beaconhs/db exec tsx src/migrate.ts
      - name: Prove migrations are idempotent
        run: pnpm --filter @beaconhs/db exec tsx src/migrate.ts
      - name: Migrate and seed the live-suite scratch databases
        run: |
          set -euo pipefail
          for db in beaconhs_ci_owner beaconhs_ci_seeded beaconhs_ci_runtime; do
            DATABASE_URL="postgresql://beaconhs_app:beaconhs_app@localhost:5432/${db}" \
            SUPERADMIN_DATABASE_URL="postgresql://beaconhs_super:beaconhs_super@localhost:5432/${db}" \
            MIGRATION_DATABASE_URL="postgresql://beaconhs_migrator:beaconhs_migrator@localhost:5432/${db}" \
            DATABASE_OWNER_ROLE=beaconhs_owner \
            pnpm --filter @beaconhs/db exec tsx src/migrate.ts
          done
          # phase11e asserts on the rows `db:seed` creates; the other two
          # databases must stay migrated-only.
          DATABASE_URL="postgresql://beaconhs_app:beaconhs_app@localhost:5432/beaconhs_ci_seeded" \
          SUPERADMIN_DATABASE_URL="postgresql://beaconhs_super:beaconhs_super@localhost:5432/beaconhs_ci_seeded" \
          MIGRATION_DATABASE_URL="postgresql://beaconhs_migrator:beaconhs_migrator@localhost:5432/beaconhs_ci_seeded" \
          pnpm --filter @beaconhs/db exec tsx src/seed.ts
      - run: pnpm test
      # Run the live suites explicitly, each with the identity and starting
      # state it needs. `pnpm test` above intentionally has no scratch URL, so
      # these assertions would otherwise remain skipped.
      - name: Live database suites — seed bootstrap (owner identity)
        env:
          SEED_TEST_SCRATCH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beaconhs_ci_owner
          SEED_TEST_SCRATCH_OWNER_URL: postgresql://postgres:postgres@localhost:5432/beaconhs_ci_owner
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beaconhs_ci_owner
          SUPERADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beaconhs_ci_owner
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beaconhs_ci_owner
        run: pnpm --filter @beaconhs/db exec vitest run --project db-owner
      - name: Live database suites — seeded integrity
        env:
          SEED_TEST_SCRATCH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beaconhs_ci_seeded
          DATABASE_URL: postgresql://beaconhs_app:beaconhs_app@localhost:5432/beaconhs_ci_seeded
          SUPERADMIN_DATABASE_URL: postgresql://beaconhs_super:beaconhs_super@localhost:5432/beaconhs_ci_seeded
          MIGRATION_DATABASE_URL: postgresql://beaconhs_migrator:beaconhs_migrator@localhost:5432/beaconhs_ci_seeded
        run: pnpm --filter @beaconhs/db exec vitest run --project db-seeded
      - name: Live database suites — tenant and RLS isolation
        env:
          SEED_TEST_SCRATCH_DATABASE_URL: postgresql://beaconhs_app:beaconhs_app@localhost:5432/beaconhs_ci_runtime
          SEED_TEST_SCRATCH_SUPERADMIN_URL: postgresql://beaconhs_super:beaconhs_super@localhost:5432/beaconhs_ci_runtime
          DATABASE_URL: postgresql://beaconhs_app:beaconhs_app@localhost:5432/beaconhs_ci_runtime
          SUPERADMIN_DATABASE_URL: postgresql://beaconhs_super:beaconhs_super@localhost:5432/beaconhs_ci_runtime
          MIGRATION_DATABASE_URL: postgresql://beaconhs_migrator:beaconhs_migrator@localhost:5432/beaconhs_ci_runtime
        run: pnpm --filter @beaconhs/db exec vitest run --project db-runtime
      - name: Live database suites — storage freeze persistence
        env:
          SEED_TEST_SCRATCH_DATABASE_URL: postgresql://beaconhs_super:beaconhs_super@localhost:5432/beaconhs_ci_runtime
          DATABASE_URL: postgresql://beaconhs_super:beaconhs_super@localhost:5432/beaconhs_ci_runtime
          SUPERADMIN_DATABASE_URL: postgresql://beaconhs_super:beaconhs_super@localhost:5432/beaconhs_ci_runtime
        run: pnpm --filter @beaconhs/db exec vitest run --project db-freeze
      - run: pnpm build

  deploy-dev:
    name: Deploy tested commit to dev
    # The gated dev deploy is the upstream main-branch path only. This fork's
    # default branch is hse-platform, whose pushes must still run the full CI
    # gate above — but calling deploy-dev from hse-platform would fail inside
    # the reusable workflow's own `refs/heads/main` guard and turn CI red.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-dev.yml
    with:
      ci_gate_completed: true
    secrets: inherit
