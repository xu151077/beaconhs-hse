name: Deploy (dev)

# Standard dev deployment, called by the CI workflow after its gate job passes
# for the same main-branch commit: build and push the commit's image, run the
# forward-only database migrations, point the Dokploy compose at the new image
# digest, redeploy, and wait for exact-SHA readiness. Images are built on
# GitHub-hosted runners; migration and deployment run on the Dokploy runner.
# All deployment-specific values live in repository secrets.

on:
  workflow_call:
    inputs:
      ci_gate_completed:
        description: Set only by the CI caller after its gate job succeeds
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/braedonsaunders/beaconhs
  COLLABORA_IMAGE: collabora/code@sha256:4e983196eb9878f339cc506c38c21f1cc3473bca3d6de883c5de08f9c0cc3a6c

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_digest: ${{ steps.promote.outputs.digest }}
    steps:
      - name: Require the gated main-branch CI caller
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CI_GATE_COMPLETED: ${{ inputs.ci_gate_completed }}
        run: |
          set -euo pipefail
          if [ "$REF" != refs/heads/main ] || [ "$CI_GATE_COMPLETED" != true ] \
            || { [ "$EVENT_NAME" != push ] && [ "$EVENT_NAME" != workflow_dispatch ]; }; then
            echo "::error::Dev deployment must be called by the main-branch CI workflow after its gate job succeeds"
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Reject stale main-branch workflow runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/require-current-main.sh
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # BuildKit does not include secret content in its layer cache key, so
      # without this the cached `next build` layer would keep serving the previous
      # key after a rotation and the image gate would block the deploy. The value
      # is the 128-bit HMAC-SHA256 fingerprint (a PRF under the key, never the
      # key), computed by the same dependency-free CLI the local entry point uses.
      - name: Compute the Server Action key fingerprint
        id: key-fingerprint
        env:
          SERVER_ACTION_KEY: ${{ secrets.DEV_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          ( umask 077; printf '%s' "$SERVER_ACTION_KEY" > "$key_file" )
          echo "fingerprint=$(node scripts/ci/server-action-key-fingerprint.mjs "$key_file")" \
            >> "$GITHUB_OUTPUT"
      # The revision stamped into the image must come from the workflow, not from
      # the caller, and it must describe the tree that is actually checked out.
      # `verify-source-origin.mjs` compares $GITHUB_SHA against the checked-out
      # HEAD, refuses unsupported triggers (a PR's synthetic merge commit is not
      # a release), and refuses a dirty tree. Without this, a 40-hex value is
      # trusted on shape alone — see EA-53 T7 / EA-55 T5a.
      # Reads only git state: no network, no API, therefore no credential.
      - name: Verify the source revision matches the checkout
        run: >-
          node scripts/ci/verify-source-origin.mjs
          --expect "${{ github.sha }}"
          --event "${{ github.event_name }}"
          --ref "${{ github.ref }}"
      - id: build-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          # Publish to a NON-DEPLOYABLE staging tag only. The release tag is
          # created by the promote step below, and only after the identity
          # assertion passes, so a bad artefact never becomes deployable.
          # Pushing here (rather than `load: true`) is required because `--load`
          # imports a docker-format image and discards the BuildKit provenance
          # attestation that the deploy gate verifies.
          push: true
          tags: ${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          cache-from: type=gha
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            DEPLOYMENT_VERSION=${{ github.sha }}
            NEXT_SERVER_ACTIONS_KEY_FINGERPRINT=${{ steps.key-fingerprint.outputs.fingerprint }}
          secrets: |
            next_server_actions_key=${{ secrets.DEV_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          # ignore-error: the GHA cache backend intermittently fails the blob
          # write ("error writing layer blob: not_found") AFTER the image is
          # already pushed — don't let a cache hiccup fail the build/deploy.
          cache-to: type=gha,mode=max,ignore-error=true
      # Reads the identity out of the pushed artefact — not out of a local build
      # tree and not out of the build log — and compares it with the revision
      # Step C verified against the checkout. A missing byte, an empty value, a
      # BUILD_ID, or a mismatch all fail here, before anything is deployable.
      - name: Assert the built image carries the verified revision
        run: >-
          node scripts/ci/verify-image-identity.mjs
          --image "${IMAGE_NAME}:staging-${GITHUB_SHA}"
          --expect "${GITHUB_SHA}"
      # This is the publication step. `imagetools create` copies the manifest
      # server-side and preserves the digest exactly (verified), so the promoted
      # tag is byte-identical to the asserted staging tag. If the assertion above
      # failed, this step never runs and no deployable tag exists.
      - name: Promote the verified digest to its release tag
        id: promote
        run: |
          set -euo pipefail
          digest="$(scripts/ci/promote-verified-image.sh \
            "${IMAGE_NAME}" \
            '${{ steps.build-image.outputs.digest }}' \
            "${IMAGE_NAME}:${GITHUB_SHA}")"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    permissions:
      contents: read
      packages: read
    runs-on: [self-hosted, dokploy]
    timeout-minutes: 45
    env:
      IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
    steps:
      # The deploy runner shares storage with Dokploy. Keep stale build cache
      # and superseded images from exhausting the host and taking the Dokploy
      # API offline. Active service images and all volumes are preserved.
      - name: Reclaim stale deployment-runner storage
        run: |
          set -euo pipefail
          echo "Storage before cleanup:"
          df -h /
          docker system df
          docker builder prune --force --filter until=168h
          docker image prune --all --force --filter until=168h
          echo "Storage after cleanup:"
          df -h /
          available_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          if ! [[ "$available_kb" =~ ^[0-9]+$ ]] || [ "$available_kb" -lt 2097152 ]; then
            echo "::error::The Dokploy runner requires at least 2 GiB free after safe Docker cleanup"
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Validate immutable build output
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The image build did not return a canonical sha256 digest"
            exit 1
          fi
          echo "Deploying immutable image ${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Configure TLS-preserving Dokploy split-DNS resolution
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_RESOLVE_IP: ${{ secrets.DOKPLOY_RESOLVE_IP }}
        run: |
          set -euo pipefail
          dokploy_host="${DOKPLOY_URL#https://}"
          if [ "$dokploy_host" = "$DOKPLOY_URL" ] \
            || [ "${#dokploy_host}" -gt 253 ] \
            || ! [[ "$dokploy_host" =~ ^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$ ]]; then
            echo "::error::DOKPLOY_URL must be an HTTPS origin with a DNS hostname, no port, path, query, fragment, or trailing slash"
            exit 1
          fi
          if ! [[ "$DOKPLOY_RESOLVE_IP" =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error::DOKPLOY_RESOLVE_IP must be a canonical private IPv4 address"
            exit 1
          fi
          IFS=. read -r ip_a ip_b ip_c ip_d <<< "$DOKPLOY_RESOLVE_IP"
          for octet in "$ip_a" "$ip_b" "$ip_c" "$ip_d"; do
            if [ "$((10#$octet))" -gt 255 ]; then
              echo "::error::DOKPLOY_RESOLVE_IP must be a canonical private IPv4 address"
              exit 1
            fi
          done
          if ! (( ip_a == 10 \
            || (ip_a == 172 && ip_b >= 16 && ip_b <= 31) \
            || (ip_a == 192 && ip_b == 168) )); then
            echo "::error::DOKPLOY_RESOLVE_IP must be an RFC 1918 private IPv4 address"
            exit 1
          fi
          printf 'DOKPLOY_CURL_RESOLVE=%s\n' \
            "${dokploy_host}:443:${DOKPLOY_RESOLVE_IP}" >> "$GITHUB_ENV"

      # Dokploy remains the preferred control plane. If its API credential is
      # unavailable, identify the one existing BeaconHS stack from the Swarm
      # service specs and perform an image-only rollout later. That fallback
      # preserves Dokploy's routing labels and every existing service setting.
      - name: Resolve the dev deployment target
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          umask 077
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          http_status="$(scripts/cluster/dokploy-curl.sh -sS --connect-timeout 5 --max-time 20 \
            --retry 2 --retry-delay 2 --retry-max-time 30 \
            --noproxy "${DOKPLOY_CURL_RESOLVE%%:*}" \
            --resolve "$DOKPLOY_CURL_RESOLVE" -G -o "$response" -w '%{http_code}' \
            "${DOKPLOY_URL%/}/api/compose.one" \
            --data-urlencode "composeId=$COMPOSE_ID")" || http_status=000

          if [ "$http_status" = 200 ]; then
            if ! jq -e --arg id "$COMPOSE_ID" \
                '.composeId == $id and .serverId == null' "$response" >/dev/null; then
              echo "::error::Dokploy compose.one did not return the configured local compose target"
              exit 1
            fi
            target_stack="$(jq -er '.appName | select(type=="string" and length>0)' "$response")"
            existing_registry_id_json="$(jq -c '
              if (has("registryId") | not) or .registryId == null then null
              elif (.registryId | type) == "string" and (.registryId | length) > 0 then
                .registryId
              else
                error("invalid registryId")
              end
            ' "$response")" \
              || { echo "::error::Dokploy compose target returned an invalid registry identity"; exit 1; }
            deploy_mode=api
          elif [[ "$http_status" =~ ^(000|401|403|500|502|503|504)$ ]]; then
            mapfile -t stacks < <(
              docker service ls --format '{{.Name}} {{.Image}}' \
                | awk '$2 ~ /^ghcr\.io\/braedonsaunders\/beaconhs(@|:)/ && $1 ~ /_web$/ {sub(/_web$/, "", $1); print $1}'
            )
            if [ "${#stacks[@]}" -ne 1 ]; then
              echo "::error::Direct deployment requires exactly one existing BeaconHS Swarm stack"
              exit 1
            fi
            target_stack="${stacks[0]}"
            for role in web worker scheduler storage-init; do
              service="${target_stack}_${role}"
              image="$(docker service inspect "$service" \
                --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')"
              if [[ ! "$image" =~ ^ghcr\.io/braedonsaunders/beaconhs(@|:) ]]; then
                echo "::error::Direct deployment target $service is not a BeaconHS service"
                exit 1
              fi
            done
            existing_registry_id_json=null
            deploy_mode=direct
            echo "::warning::Dokploy API returned HTTP $http_status; using the validated image-only Swarm rollout"
          else
            echo "::error::Dokploy compose.one returned unexpected HTTP $http_status"
            exit 1
          fi

          if [[ ! "$target_stack" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Deployment target returned an invalid Swarm stack name"
            exit 1
          fi
          {
            printf 'DOKPLOY_TARGET_STACK=%s\n' "$target_stack"
            printf 'DOKPLOY_EXISTING_REGISTRY_ID_JSON=%s\n' "$existing_registry_id_json"
            printf 'DOKPLOY_DEPLOY_MODE=%s\n' "$deploy_mode"
          } >> "$GITHUB_ENV"

      # Prove this run's least-privilege package token can read the exact
      # private image before touching anything. The token stays in a temporary
      # Docker config and is never persisted over Dokploy's registry login.
      - name: Pre-pull images onto the swarm manager
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker CLI not present on runner (socket mount expected)"
            exit 1
          fi
          IMAGE="${IMAGE_NAME}@${IMAGE_DIGEST}"
          DOCKER_CONFIG="$(mktemp -d)"
          chmod 0700 "$DOCKER_CONFIG"
          export DOCKER_CONFIG
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format 'pulled {{.Id}}'
          docker pull "$COLLABORA_IMAGE"
          docker image inspect "$COLLABORA_IMAGE" --format 'pulled Collabora {{.Id}}'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24.18.0 }
      # Install Node first: the self-hosted runner's system Node is not a
      # supported application runtime, and pnpm's installer invokes npm.
      # package.json's packageManager field pins pnpm; passing a version here
      # too errors with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - run: pnpm install --frozen-lockfile

      # The image is immutable per digest, but the key it embedded is a build
      # secret. Prove the pushed image's build-time key equals the expected
      # deployment key BEFORE migrations and before any traffic moves. The gate
      # prints only a fingerprint; the key never reaches a log or an artifact.
      - name: Gate the image's Server Action key
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.DEV_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          expected="$(scripts/ci/verify-server-action-key-gate.sh fingerprint --env \
            | sed -n 's/^fingerprint=//p')"
          test -n "$expected"
          scripts/ci/verify-server-action-key-gate.sh image \
            "${IMAGE_NAME}@${IMAGE_DIGEST}" "$expected"
          printf 'EXPECTED_SERVER_ACTION_KEY_FINGERPRINT=%s\n' "$expected" >> "$GITHUB_ENV"

      # Gate every identity decision on the candidate image BEFORE migrations and
      # before any traffic moves. The assembler is the only component that reads
      # the registry; the gate is the only component that decides. Both are
      # reused from EA-54 unchanged.
      - name: Gate the candidate image before deployment
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(mktemp -d)"
          chmod 0700 "$DOCKER_CONFIG"
          export DOCKER_CONFIG
          candidate="$(mktemp)"
          trap 'rm -f "$candidate"; docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          # The index must be read with `buildx imagetools inspect --raw`: plain
          # `docker manifest inspect` strips the attestation descriptor's
          # annotations, which is where the provenance subject binding lives.
          if ! docker buildx version >/dev/null 2>&1; then
            echo "::error::the deploy gate needs the docker buildx plugin to read OCI index annotations (provenance subject binding); install docker-buildx-plugin on this runner"
            exit 1
          fi
          node scripts/ci/assemble-gate-candidate.mjs \
            --image "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --expect-revision "${GITHUB_SHA}" \
            --policy scripts/ci/deploy-gate-policy.json \
            --out "$candidate"
          node scripts/ci/deployment-gate.mjs --input "$candidate"

      # Forward-only schema migrations run before the redeploy. The unpooled
      # migrator login can SET ROLE to the NOLOGIN owner; neither credential
      # reaches the long-running deployment containers.
      - name: Run database migrations
        env:
          NODE_ENV: production
          MIGRATION_DATABASE_URL: ${{ secrets.DEV_MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          SUPERADMIN_DATABASE_URL: ${{ secrets.DEV_SUPERADMIN_DATABASE_URL }}
          DATABASE_OWNER_ROLE: beaconhs_owner
        run: pnpm --filter @beaconhs/db exec tsx src/migrate.ts

      # coolwsd caches browser assets at startup, so a changed branding file
      # needs a Collabora restart; an unchanged file needs nothing.
      - name: Install Collabora branding on the swarm manager
        run: |
          set -euo pipefail
          before="$(docker run --rm -v /etc/dokploy/beaconhs:/target alpine:3@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b \
            sh -c 'sha256sum /target/collabora-branding.js 2>/dev/null | cut -d" " -f1' || true)"
          docker run --rm -i -v /etc/dokploy/beaconhs:/target alpine:3@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b \
            sh -c 'cat > /target/collabora-branding.js && chmod 0644 /target/collabora-branding.js' \
            < deploy/collabora-branding.js
          after="$(sha256sum deploy/collabora-branding.js | cut -d' ' -f1)"
          echo "branding installed ($(wc -c < deploy/collabora-branding.js) bytes)"
          if [ "$before" != "$after" ]; then
            service="${DOKPLOY_TARGET_STACK}_collabora"
            if docker service inspect "$service" >/dev/null 2>&1; then
              echo "branding changed — restarting the current Collabora service"
              docker service update --force "$service" >/dev/null
            else
              echo "No existing Collabora service found; the new deployment will load the branding"
            fi
          else
            echo "branding unchanged — no restart needed"
          fi

      - name: Update the Dokploy compose environment
        if: env.DOKPLOY_DEPLOY_MODE == 'api'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DEV_SUPERADMIN_DATABASE_URL: ${{ secrets.DEV_SUPERADMIN_DATABASE_URL }}
          REDIS_URL: ${{ secrets.DEV_REDIS_URL }}
          APP_URL: ${{ secrets.DEV_APP_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.DEV_BETTER_AUTH_SECRET }}
          ATTACHMENT_CAPABILITY_SECRET: ${{ secrets.DEV_ATTACHMENT_CAPABILITY_SECRET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          # Private in-network object-store address for server-side S3 I/O. Distinct
          # from R2_ENDPOINT, which stays the browser/presign endpoint.
          R2_INTERNAL_ENDPOINT: ${{ secrets.R2_INTERNAL_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PRIVATE_BUCKET_CONFIRMED: ${{ secrets.R2_PRIVATE_BUCKET_CONFIRMED }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SYNC_DATABASE_HOST_ALLOWLIST: ${{ secrets.SYNC_DATABASE_HOST_ALLOWLIST }}
        run: |
          set -euo pipefail
          umask 077
          update_response="$(mktemp)"
          compose_state="$(mktemp)"
          env_block_file="$(mktemp)"
          trap 'rm -f "$update_response" "$compose_state" "$env_block_file"' EXIT
          IMAGE="${IMAGE_NAME}@${IMAGE_DIGEST}"
          COMPOSE_FILE="$(cat deploy/dokploy-dev.compose.yaml)"
          # Collabora is served same-origin on the app domain (Traefik path
          # routes), so both editor and WOPI-callback bases are APP_URL; the
          # server_name is the bare host for Collabora's generated URLs.
          APP_HOST="$(printf '%s' "$APP_URL" | sed -E 's~^https?://~~; s~/+$~~' | tr '[:upper:]' '[:lower:]')"
          {
            printf 'IMAGE=%s\n' "$IMAGE"
            printf 'APP_VERSION=%s\n' "$GITHUB_SHA"
            printf 'WRITER_REPLICAS=1\n'
            printf 'COLLABORA_IMAGE=%s\n' "$COLLABORA_IMAGE"
            printf 'COLLABORA_URL=%s\n' "$APP_URL"
            printf 'COLLABORA_WOPI_URL=%s\n' "$APP_URL"
            printf 'COLLABORA_SERVER_NAME=%s\n' "$APP_HOST"
            printf 'DATABASE_URL=%s\n' "$DEV_DATABASE_URL"
            printf 'SUPERADMIN_DATABASE_URL=%s\n' "$DEV_SUPERADMIN_DATABASE_URL"
            printf 'REDIS_URL=%s\n' "$REDIS_URL"
            printf 'APP_URL=%s\n' "$APP_URL"
            printf 'PUBLIC_APP_URL=%s\n' "$APP_URL"
            printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
            printf 'ATTACHMENT_CAPABILITY_SECRET=%s\n' "$ATTACHMENT_CAPABILITY_SECRET"
            printf 'R2_ENDPOINT=%s\n' "$R2_ENDPOINT"
            printf 'R2_INTERNAL_ENDPOINT=%s\n' "$R2_INTERNAL_ENDPOINT"
            printf 'R2_ACCESS_KEY_ID=%s\n' "$R2_ACCESS_KEY_ID"
            printf 'R2_SECRET_ACCESS_KEY=%s\n' "$R2_SECRET_ACCESS_KEY"
            printf 'R2_BUCKET=%s\n' "$R2_BUCKET"
            printf 'R2_PRIVATE_BUCKET_CONFIRMED=%s\n' "$R2_PRIVATE_BUCKET_CONFIRMED"
            printf 'VAPID_PUBLIC_KEY=%s\n' "$VAPID_PUBLIC_KEY"
            printf 'VAPID_PRIVATE_KEY=%s\n' "$VAPID_PRIVATE_KEY"
            printf 'VAPID_SUBJECT=%s\n' "$VAPID_SUBJECT"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
            printf 'SYNC_DATABASE_HOST_ALLOWLIST=%s\n' "${SYNC_DATABASE_HOST_ALLOWLIST:-10.0.0.44}"
          } > "$env_block_file"
          jq -n --arg id "$COMPOSE_ID" --arg cf "$COMPOSE_FILE" \
            --argjson registry "$DOKPLOY_EXISTING_REGISTRY_ID_JSON" \
            --rawfile env "$env_block_file" \
            '{composeId:$id, sourceType:"raw", composeType:"stack",
              composeFile:$cf, env:$env, command:"", autoDeploy:false,
              randomize:false, isolatedDeployment:false,
              isolatedDeploymentsVolume:false, suffix:"",
              composePath:"./docker-compose.yml", registryId:$registry}' \
            | scripts/cluster/dokploy-curl.sh -sS --fail --connect-timeout 5 --max-time 30 \
                --noproxy "${DOKPLOY_CURL_RESOLVE%%:*}" \
                --resolve "$DOKPLOY_CURL_RESOLVE" -o "$update_response" \
                -X POST "${DOKPLOY_URL%/}/api/compose.update" \
                -H "content-type: application/json" --data @-
          # Re-read and prove the persisted compose matches what we sent — a
          # 2xx acknowledgement alone has been observed to be ambiguous.
          scripts/cluster/dokploy-curl.sh -sS --fail --connect-timeout 5 --max-time 20 \
            --retry 2 --retry-delay 2 --retry-max-time 30 \
            --noproxy "${DOKPLOY_CURL_RESOLVE%%:*}" --resolve "$DOKPLOY_CURL_RESOLVE" \
            -G -o "$compose_state" "${DOKPLOY_URL%/}/api/compose.one" \
            --data-urlencode "composeId=$COMPOSE_ID"
          if ! jq -e --arg cid "$COMPOSE_ID" --arg cf "$COMPOSE_FILE" \
              --rawfile env "$env_block_file" '
                .composeId==$cid and .serverId==null
                  and .composeFile==$cf and .env==$env
                  and .composeType=="stack" and .sourceType=="raw"
                  and .autoDeploy==false' "$compose_state" >/dev/null; then
            echo "::error::Dokploy compose/environment postcondition failed after the update"
            exit 1
          fi
          echo "Updated Dokploy compose environment for $IMAGE"

      - name: Deploy the compose on Dokploy
        if: env.DOKPLOY_DEPLOY_MODE == 'api'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          jq -n --arg id "$COMPOSE_ID" '{composeId:$id}' \
            | scripts/cluster/dokploy-curl.sh -sS --fail --connect-timeout 5 --max-time 60 \
                --noproxy "${DOKPLOY_CURL_RESOLVE%%:*}" \
                --resolve "$DOKPLOY_CURL_RESOLVE" \
                -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
                -H "content-type: application/json" --data @- >/dev/null
          echo "Dokploy compose deployment requested"

      - name: Roll the immutable image directly on Swarm
        if: env.DOKPLOY_DEPLOY_MODE == 'direct'
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}@${IMAGE_DIGEST}"
          for role in web worker scheduler; do
            service="${DOKPLOY_TARGET_STACK}_${role}"
            docker service update --detach=true --with-registry-auth \
              --image "$image" --env-rm APP_VERSION \
              --env-add "APP_VERSION=$GITHUB_SHA" "$service"
          done
          docker service update --detach=true --with-registry-auth \
            --image "$image" "${DOKPLOY_TARGET_STACK}_storage-init"
          echo "Requested direct immutable-image rollout for $DOKPLOY_TARGET_STACK"

      - name: Wait for external readiness
        env:
          APP_URL: ${{ secrets.DEV_APP_URL }}
        run: |
          set -euo pipefail
          ready_url="${APP_URL%/}/api/health/ready"
          login_url="${APP_URL%/}/login"
          deadline=$((SECONDS + 600))
          last_login_status="not checked"
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(curl -fsS --connect-timeout 5 --max-time 15 "$ready_url" 2>/dev/null || true)"
            if [ -n "$body" ] \
              && jq -e --arg sha "$GITHUB_SHA" \
                  '.status=="ready" and .version==$sha' <<< "$body" >/dev/null 2>&1; then
              last_login_status="$(curl -sS -o /dev/null -w '%{http_code}' \
                --connect-timeout 5 --max-time 15 "$login_url" || true)"
              if [ "$last_login_status" = 200 ]; then
                echo "Deployment is externally ready at commit $GITHUB_SHA"
                echo "Login page responds 200 — deployment healthy"
                exit 0
              fi
              echo "Readiness reports the new commit; /login returned HTTP ${last_login_status:-000}. Retrying."
            fi
            sleep 10
          done
          echo "::error::Deployment did not become externally ready with a healthy login page within 10 minutes (last /login status: ${last_login_status:-000})"
          exit 1

      # Readiness only proves the task the load balancer happened to reach. In the
      # direct rollout path the tasks are reachable from this runner, so check
      # EVERY running web task: each must report the expected commit AND use the
      # build-time key verified above, or a runtime override with the expected
      # fingerprint. A mixed fleet fails the deployment instead of surfacing later
      # as "Failed to find Server Action" on cross-instance requests, or as a
      # half-rolled-out release (Phase EA-8 reproduced two tasks both reporting
      # "ready" on different commits). The Dokploy compose path has no task access
      # from the runner: there the image gate above is the binding proof and the
      # stack runs on the embedded build-time key (deploy/dokploy-dev.compose.yaml
      # sets no runtime override).
      - name: Verify every web replica's commit and Server Action key
        if: env.DOKPLOY_DEPLOY_MODE == 'direct'
        run: |
          set -euo pipefail
          scripts/ci/verify-server-action-key-gate.sh replicas \
            "$DOKPLOY_TARGET_STACK" "$EXPECTED_SERVER_ACTION_KEY_FINGERPRINT" "$GITHUB_SHA"

      # Gate 5 — reconcile the digest that is ACTUALLY RUNNING with the digest
      # that was gated. Readiness compares APP_VERSION, which is a runtime
      # environment variable: a task can answer 200 with the right version while
      # running a different image (EA56-T23). Only the service spec proves image
      # identity, so this reads it back and refuses a mixed or stale fleet.
      #
      # This runs on every deployment path. A path that cannot expose its running
      # services is not exempt: the reconciler fails closed when it cannot read a
      # digest, so the run fails instead of reporting an unverified deployment as
      # successful. The expected digest, the release tag and a readiness 200 are
      # never accepted as substitutes for the running digest.
      #
      # The roster file states what the stack is DEFINED to run: which gated
      # services must exist, their replica counts, and which roles must have live
      # tasks. It is generated here — from this workflow's own values and the
      # compose file in the checkout — never from a query of the running fleet,
      # because a roster derived from what was found could not detect a missing
      # service (EA59 S12 / F-59-1). The reconciler refuses to run without it.
      - name: Reconcile the running image digest
        env:
          WRITER_REPLICAS: 1
        run: |
          set -euo pipefail
          roster="$(mktemp)"
          trap 'rm -f "$roster"' EXIT
          {
            echo "stack=$DOKPLOY_TARGET_STACK"
            echo "source=deploy/dokploy-dev.compose.yaml + deploy env (WRITER_REPLICAS=$WRITER_REPLICAS)"
            echo "digest=$IMAGE_DIGEST"
            for role in web worker; do
              echo "$role.replicas=$WRITER_REPLICAS"
              echo "$role.running=true"
            done
            # scheduler and storage-init are one-shot: they register jobs /
            # bootstrap storage and finish successfully, so no live task
            # survives the rollout. Their identity is proven by the service
            # spec plus a completed task on the gated digest; requiring a
            # live task would fail every successful deployment.
            for role in scheduler storage-init; do
              echo "$role.replicas=1"
              echo "$role.running=false"
            done
          } > "$roster"
          if ! scripts/ci/reconcile-running-digest.sh "$DOKPLOY_TARGET_STACK" "$IMAGE_DIGEST" "$roster"; then
            echo "::error::Gate 5 could not prove that stack '${DOKPLOY_TARGET_STACK}' runs ${IMAGE_DIGEST}. The rollout may have been requested, but this run is not a verified release: the running image digest was not read back and matched, or the fleet did not match its roster." >&2
            exit 1
          fi
