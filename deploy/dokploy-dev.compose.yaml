# BeaconHS dev stack for Dokploy.
#
# The GitHub deploy workflow injects all ${VARS} at deploy time. The same image
# runs web, worker, and scheduler roles selected by APP_ROLE.

services:
  web:
    image: ${IMAGE}
    environment:
      APP_ROLE: web
      NODE_ENV: production
      # Next standalone must listen on all interfaces for the reverse proxy.
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      APP_VERSION: ${APP_VERSION}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: dev
      DATABASE_URL: ${DATABASE_URL}
      # Dedicated BYPASSRLS pool for super-admin / cross-tenant access.
      SUPERADMIN_DATABASE_URL: ${SUPERADMIN_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ATTACHMENT_CAPABILITY_SECRET: ${ATTACHMENT_CAPABILITY_SECRET}
      BETTER_AUTH_URL: ${APP_URL}
      APP_URL: ${APP_URL}
      PUBLIC_APP_URL: ${APP_URL}
      R2_ENDPOINT: ${R2_ENDPOINT}
      # Server-side S3 I/O only. Keep this on the private in-network address so
      # put/get/head/delete never hairpin out to the public hostname, and so
      # storage-init does not depend on the Cloudflare Tunnel. R2_ENDPOINT above
      # stays the browser/presign endpoint.
      R2_INTERNAL_ENDPOINT: ${R2_INTERNAL_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PRIVATE_BUCKET_CONFIRMED: ${R2_PRIVATE_BUCKET_CONFIRMED}
      # Web serves the public key to the subscribe client and signs the
      # "send test push" action, so it needs the full keypair too.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # In-browser PowerPoint editor. Collabora is served SAME-ORIGIN on the
      # app domain via Traefik path routes (/browser, /cool, /hosting), so the
      # editor URL and the WOPI callback base are both just APP_URL.
      COLLABORA_URL: ${COLLABORA_URL}
      COLLABORA_WOPI_URL: ${COLLABORA_WOPI_URL}
      # On-prem AdminApp2 MSSQL (10.0.0.44). Override via env when another host
      # must be allowlisted; an empty value would block the private-IP sync.
      SYNC_DATABASE_HOST_ALLOWLIST: ${SYNC_DATABASE_HOST_ALLOWLIST:-10.0.0.44}
    networks: [infra-net, dokploy-network]
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/api/health/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      # The deploy workflow first persists WRITER_REPLICAS=0 as a control-plane
      # fence. A concurrent Dokploy deploy therefore cannot revive old database
      # writers during migration; the final exact-SHA deploy restores this to 1.
      replicas: ${WRITER_REPLICAS}
      placement:
        constraints: [node.hostname==dokploy-mgr]
      restart_policy:
        condition: any
        delay: 5s

  worker:
    image: ${IMAGE}
    environment:
      APP_ROLE: worker
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: dev
      # The worker unseals DB-stored provider secrets (email/SMS/AI keys,
      # connector creds) with the same key web seals them with — without this
      # every sealed transport fails closed instead of using the configured provider.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      # Dedicated cross-tenant DML pool. Migration credentials are never
      # injected into a long-running application container.
      SUPERADMIN_DATABASE_URL: ${SUPERADMIN_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      R2_ENDPOINT: ${R2_ENDPOINT}
      # Server-side S3 I/O only. Keep this on the private in-network address so
      # put/get/head/delete never hairpin out to the public hostname, and so
      # storage-init does not depend on the Cloudflare Tunnel. R2_ENDPOINT above
      # stays the browser/presign endpoint.
      R2_INTERNAL_ENDPOINT: ${R2_INTERNAL_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PRIVATE_BUCKET_CONFIRMED: ${R2_PRIVATE_BUCKET_CONFIRMED}
      APP_URL: ${APP_URL}
      PUBLIC_APP_URL: ${APP_URL}
      # Keep durable Flow dispatch on the private overlay network.
      INTERNAL_WEB_URL: http://web:3000
      # Worker fans push notifications out to subscribed devices.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      SYNC_DATABASE_HOST_ALLOWLIST: ${SYNC_DATABASE_HOST_ALLOWLIST:-10.0.0.44}
    networks: [infra-net]
    healthcheck:
      test: ['CMD', 'node', 'apps/worker/dist/health.js']
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    deploy:
      replicas: ${WRITER_REPLICAS}
      placement:
        constraints: [node.hostname==dokploy-mgr]
      restart_policy:
        condition: any
        delay: 5s

  # Object storage. Self-hosted S3-compatible, private bucket, NO published ports:
  # reachable only from the other services on `infra-net`, and from the outside
  # world only through the Cloudflare Tunnel, which routes `^/<bucket>/` here.
  #
  # Why the bucket lives at the ROOT of the public hostname
  # ------------------------------------------------------
  # BeaconHS hands the browser a PRESIGNED url and the browser PUTs/GETs it
  # directly. The AWS SDK signs the request path, and cloudflared forwards the
  # path to the origin WITHOUT stripping or rewriting it. So the origin address
  # and the signed path must agree. Measured in Phase 18-I: with a `/storage`
  # prefix the proxy must strip it for MinIO to route, which makes MinIO recompute
  # the signature over a different path — `SignatureDoesNotMatch` on every
  # operation. Root-level (`R2_ENDPOINT=https://<public-host>`, path
  # `/<bucket>/<key>`) verified working in Phase 18-J: PUT 200 + etag, GET 200 with
  # byte-exact content, server-side put/head/delete all clean.
  #
  # A subpath is therefore not an option here, and neither is a second hostname.
  #
  # CREDENTIALS AND ENDPOINT come from the deployment environment, exactly as the
  # R2_* variables always have: `packages/storage` reads `R2_ENDPOINT`,
  # `R2_ACCESS_KEY_ID`, `R2_SECRET_ACCESS_KEY`, `R2_BUCKET` regardless of vendor.
  # NOTE there is only ONE endpoint: the same value is used for the server-side
  # S3 client AND for the presigned urls handed to the browser. See the runbook.
  minio:
    # Pin the tested release and its linux/amd64 digest. `latest` can otherwise
    # change independently of BeaconHS CI, and a MinIO major bump changes
    # signature/lifecycle behaviour under a running deployment.
    image: minio/minio@sha256:b187417eee0a495ed45ff0e2d5f0c9810ae35705319c0d2fb46dd93e4ac1501c
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Keep the console bound but unpublished — it is an operator tool, never
      # reachable from the tunnel.
    volumes:
      - minio-data:/data
    networks: [infra-net]
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname==dokploy-mgr]
      restart_policy:
        condition: any
        delay: 5s
    # NOTE: deliberately NO `ports:`. Neither the S3 API (9000) nor the console
    # (9001) is published to the host or the internet.

  # One-shot storage security bootstrap. It creates the bucket if absent, removes
  # anonymous MinIO/S3 bucket policies, installs pending-upload and
  # transient-artifact expiry, and proves anonymous reads fail. Idempotent:
  # HeadBucket, and CreateBucket only when it is genuinely missing.
  # Cloudflare R2 additionally requires the explicit private-bucket
  # confirmation after public development/custom domains have been disabled; a
  # self-hosted MinIO endpoint is detected by hostname and correctly skips it.
  storage-init:
    image: ${IMAGE}
    environment:
      APP_ROLE: storage-init
      NODE_ENV: production
      R2_ENDPOINT: ${R2_ENDPOINT}
      # Server-side S3 I/O only, and the reason this role can bootstrap with the
      # Cloudflare Tunnel stopped: bucket setup and the privacy probe both run on the
      # private in-network address. R2_ENDPOINT above stays browser/presign only.
      R2_INTERNAL_ENDPOINT: ${R2_INTERNAL_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PRIVATE_BUCKET_CONFIRMED: ${R2_PRIVATE_BUCKET_CONFIRMED}
    networks: [infra-net]
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname==dokploy-mgr]
      restart_policy:
        condition: on-failure
        delay: 5s

  scheduler:
    image: ${IMAGE}
    environment:
      APP_ROLE: scheduler
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: dev
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    networks: [infra-net]
    deploy:
      replicas: ${WRITER_REPLICAS}
      placement:
        constraints: [node.hostname==dokploy-mgr]
      # One-shot: register BullMQ repeatable jobs, then exit. Exit 0 is success
      # and is not restarted; a failed registry read-back exits 1 and retries at
      # most five times.
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  # In-browser PowerPoint editor for PPTX-mastered training decks. Reached by
  # browsers and by the web app (discovery) through Traefik path routes on the
  # app domain; Collabora itself calls back into the app's /wopi/files/* routes
  # at APP_URL (aliasgroup1 allow-list).
  collabora:
    # Pin both the tested CODE release and linux/amd64 digest. `latest` can
    # otherwise change independently of BeaconHS CI and silently break WOPI.
    image: ${COLLABORA_IMAGE}
    environment:
      aliasgroup1: ${COLLABORA_URL}
      server_name: ${COLLABORA_SERVER_NAME}
      # TLS terminates at Traefik; frame_ancestors lets the app iframe the
      # editor; welcome dialogs are noise inside an embedded editor. The WOPI
      # load ceiling matches MAX_PPTX_FILE_BYTES (exactly 1 GiB).
      # The allow-list follows COLLABORA_URL, not APP_URL: the allow-list must
      # name the origin browsers actually use to reach Collabora. The deploy
      # workflow currently sets COLLABORA_URL=$APP_URL, so this is
      # behaviour-preserving today while removing the trap where a separate
      # Collabora host would be silently rejected by WOPI discovery.
      extra_params: --o:ssl.enable=false --o:ssl.termination=true --o:net.frame_ancestors=${COLLABORA_URL} --o:welcome.enable=false --o:home_mode.enable=true --o:storage.wopi.max_file_size=1073741824
    volumes:
      # BeaconHS theme via the sanctioned branding.js hook. The deploy workflow
      # writes this file onto the swarm manager before deploying the stack.
      - /etc/dokploy/beaconhs/collabora-branding.js:/usr/share/coolwsd/browser/dist/branding.js:ro
    networks: [dokploy-network]
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname==dokploy-mgr]
      restart_policy:
        condition: any
        delay: 5s

networks:
  infra-net:
    external: true
  dokploy-network:
    external: true

volumes:
  # Object storage for the self-hosted MinIO service above. Named rather than
  # bind-mounted so the deploy runner's storage reclamation cannot delete tenant
  # documents.
  minio-data:
